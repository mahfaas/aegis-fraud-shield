spring:
  application:
    name: fraudshield

  datasource:
    url: jdbc:postgresql://localhost:5432/fraud_db
    username: admin
    password: rootpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.github.mahfaas.fraudshield.model
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

fraud:
  rules:
    amount:
      decline-threshold: 500000
      review-threshold: 100000
    velocity:
      max-transactions: 5
      window-seconds: 60
    merchant-category:
      enabled: false   # set to true to activate MerchantCategoryRule
    time-window:
      enabled: true
      high-risk-start-hour: 2     # 2 AM UTC (inclusive)
      high-risk-end-hour: 5       # 5 AM UTC (exclusive)
      flag-weekends: true
      high-risk-categories:
        - gambling
        - crypto
        - wire-transfer
        - adult
        - forex
    geo-velocity:
      enabled: true    # set to false to disable GeoVelocityRule (e.g. if Redis is unavailable)
    risk-score:
      soft-threshold: 60   # accumulated score >= soft → escalate APPROVED to MANUAL_REVIEW
      hard-threshold: 90   # accumulated score >= hard → always DECLINED

  kafka:
    topic-in: transactions-raw
    topic-out: transactions-verdicted
    topic-dlq: transactions-dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: fraudshield
